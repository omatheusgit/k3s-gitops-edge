defaultNamespace: loja
labels:
  app.kubernetes.io/component: smoke
dependsOn:
  - selector:
      matchLabels:
        app.kubernetes.io/component: ingress
targetCustomizations:
  # Diagnostico (whoami, podinfo) so no laboratorio. Antes era "tudo que nao
  # for producao", e um cluster importado sem o label recebia o podinfo, que
  # tem /panic e /env abertos.
  - name: fora-do-lab
    clusterSelector:
      matchExpressions:
        - { key: ambiente, operator: NotIn, values: [lab] }
    doNotDeploy: true
