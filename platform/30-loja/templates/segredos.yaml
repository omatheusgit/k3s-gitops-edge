# Um ExternalSecret por loja. O caminho no Secrets Manager inclui o id da loja,
# e a policy IAM do usuario da loja so libera esse prefixo (ver terraform/10-frota).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loja-segredos
  namespace: loja
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: loja-segredos
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        MIGRACAO_URL: "postgres://postgres:{{ `{{ .postgres_senha }}` }}@postgres:5432/loja?sslmode=disable"
        PGRST_DB_URI: "postgres://autenticador:{{ `{{ .autenticador_senha }}` }}@postgres:5432/loja"
        DATABASE_URL: "postgres://eventos:{{ `{{ .eventos_senha }}` }}@postgres:5432/loja"
        DATABASE_URL_RELAY: "postgres://relay:{{ `{{ .relay_senha }}` }}@postgres:5432/loja"
        AMQP_URL_RELAY: "amqp://relay:{{ `{{ .amqp_relay_senha }}` }}@rabbitmq:5672/%2F"
        AMQP_URL_CONSUMIDOR: "amqp://consumidor:{{ `{{ .amqp_consumidor_senha }}` }}@rabbitmq:5672/%2F"
        AMQP_URL_GATEWAY: "amqp://gateway:{{ `{{ .amqp_gateway_senha }}` }}@rabbitmq:5672/%2F"
        REDIS_URL: "redis://:{{ `{{ .redis_senha }}` }}@redis:6379/0"
  # Tudo da loja, inclusive a chave do JWT, vem de lojas/<id>/app.
  dataFrom:
    - extract:
        key: {{ printf "lojas/%s/app" .Values.loja }}
