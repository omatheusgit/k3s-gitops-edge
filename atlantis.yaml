# Atlantis roda plan/apply nos PRs que mexem na camada da frota.
# A 00-state e o ovo da galinha (guarda o state das outras) e roda a mao.
version: 3
automerge: false
parallel_plan: false

projects:
  - name: frota
    dir: terraform/10-frota
    autoplan:
      when_modified: ["*.tf", "*.tfbackend"]
    terraform_version: v1.9.8
    # "mergeable" = CI verde e branch protection satisfeita. "approved" nao
    # serve num repo de uma pessoa: o GitHub nao deixa aprovar o proprio PR.
    apply_requirements: [mergeable]
    workflow: lab

workflows:
  # No laboratorio o Atlantis roda na mesma rede Docker do LocalStack.
  lab:
    plan:
      steps:
        - init:
            extra_args:
              - -backend-config=lab.s3.tfbackend
              - '-backend-config=endpoints={s3="http://localstack:4566",dynamodb="http://localstack:4566",sts="http://localstack:4566"}'
        - plan:
            extra_args: ["-var", "localstack=http://localstack:4566"]
    apply:
      steps:
        - apply
