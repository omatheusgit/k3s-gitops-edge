# Modo completo (Rancher na central). Pesado demais para rodar em todo PR e
# para o notebook: roda sob demanda e toda segunda, num runner de 16 GB.
name: rancher

on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1"

permissions:
  contents: read

jobs:
  loja-via-rancher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      K3D_VERSAO: v5.9.0
      RANCHER_HOST: rancher.lab.internal
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: instalar k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${K3D_VERSAO} bash
      - name: nome do Rancher no host
        run: echo "127.0.0.1 ${RANCHER_HOST}" | sudo tee -a /etc/hosts
      - run: git switch -c rancher
      - run: lab/nuvem.sh up
      - run: lab/central.sh up rancher
      - run: lab/loja.sh up loja-001 8080
      - name: esperar a loja ficar pronta
        run: |
          export KUBECONFIG=lab/.cache/loja-001.kubeconfig
          for i in $(seq 1 120); do
            kubectl -n loja get deploy eventos-consumidor >/dev/null 2>&1 && break
            sleep 10
          done
          kubectl -n loja wait --for=condition=Available deploy --all --timeout=15m
          kubectl -n loja rollout status statefulset --timeout=10m
      - run: lab/testes/e2e.sh loja-001 8080
      - name: a loja aparece no Rancher com os labels
        run: |
          curl -fsS --cacert lab/.cache/ca.crt -u "admin:$(cat lab/.cache/rancher-senha)" \
            "https://${RANCHER_HOST}/v1/provisioning.cattle.io.clusters/fleet-default/loja-001" \
            | jq '{ready: .status.ready, labels: .metadata.labels}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: diagnostico em caso de falha
        if: failure()
        run: |
          export KUBECONFIG=lab/.cache/central.kubeconfig
          kubectl -n cattle-system get pods || true
          kubectl -n cattle-system logs deploy/rancher --tail=60 || true
          kubectl -n fleet-default get clusters.fleet.cattle.io,bundles -o wide || true
          export KUBECONFIG=lab/.cache/loja-001.kubeconfig
          kubectl get pods -A || true
          kubectl -n cattle-system logs deploy/cattle-cluster-agent --tail=60 || true
