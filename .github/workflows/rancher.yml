# Modo completo (Rancher na central). Pesado demais para rodar em todo PR e
# para o notebook: roda quando o caminho do Rancher muda, sob demanda e toda
# segunda, num runner de 16 GB.
name: rancher

on:
  pull_request:
    paths:
      - .github/workflows/rancher.yml
      - lab/central.sh
      - lab/rancher-token.sh
      - installer/lib/rancher.sh
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1"

permissions:
  contents: read

jobs:
  loja-via-rancher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      K3D_VERSAO: v5.9.0
      RANCHER_HOST: rancher.lab.internal
      RANCHER_MEMORIA: 3Gi
    steps:
      # Rancher + LocalStack + dois clusters k3s enchem o disco padrao do runner
      # (o kubelet despeja o Rancher por DiskPressure). Remove toolchains que
      # este job nao usa.
      - name: liberar disco do runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: instalar k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${K3D_VERSAO} bash
      - name: nome do Rancher no host
        run: echo "127.0.0.1 ${RANCHER_HOST}" | sudo tee -a /etc/hosts
      - run: git switch -c rancher
      - run: lab/nuvem.sh up
      - run: lab/central.sh up rancher
      - run: lab/loja.sh up loja-001 8080
      - name: esperar a loja ficar pronta
        run: |
          export KUBECONFIG=lab/.cache/loja-001.kubeconfig
          for i in $(seq 1 120); do
            kubectl -n loja get deploy eventos-consumidor >/dev/null 2>&1 && break
            sleep 10
          done
          kubectl -n loja wait --for=condition=Available deploy --all --timeout=15m
          kubectl -n loja rollout status statefulset --timeout=10m
      - run: lab/testes/e2e.sh loja-001 8080
      - name: a loja aparece no Rancher com os labels
        run: |
          KUBECONFIG=lab/.cache/central.kubeconfig kubectl -n fleet-default \
            get clusters.provisioning.cattle.io loja-001 -o json \
            | jq '{ready: .status.ready, labels: .metadata.labels}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: diagnostico em caso de falha
        if: failure()
        run: |
          export KUBECONFIG=lab/.cache/central.kubeconfig
          kubectl get nodes -o wide || true
          kubectl describe nodes | grep -A8 -E '^Conditions|Allocated resources' || true
          kubectl -n cattle-system get pods -o wide || true
          kubectl -n cattle-system describe pods | grep -E '^Name:|Reason|Exit Code|OOM|Warning|FailedScheduling' || true
          kubectl -n cattle-system logs deploy/rancher --tail=60 || true
          kubectl -n cattle-system logs deploy/rancher --previous --tail=40 || true
          df -h / || true
          kubectl -n fleet-default get clusters.fleet.cattle.io,bundles -o wide || true
          export KUBECONFIG=lab/.cache/loja-001.kubeconfig
          kubectl get pods -A || true
          kubectl -n cattle-system logs deploy/cattle-cluster-agent --tail=60 || true
