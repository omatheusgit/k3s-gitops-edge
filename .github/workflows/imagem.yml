# Publica a imagem do servico de eventos no GHCR, com SBOM e proveniencia.
name: imagem

on:
  push:
    branches: [main]
    paths: [src/eventos/**]
    tags: ["eventos-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

# shell: bash liga o pipefail; o padrao do runner (bash -e) deixa um
# `script | tee` passar mesmo com o script falhando.
defaults:
  run:
    shell: bash

jobs:
  eventos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/eventos
          tags: |
            type=match,pattern=eventos-v(.*),group=1
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: src/eventos
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
