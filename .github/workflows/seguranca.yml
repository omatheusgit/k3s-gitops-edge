name: seguranca

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # a action lista os commits do PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  configuracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eventos:scan src/eventos
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eventos:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
