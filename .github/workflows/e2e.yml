# Sobe o laboratorio inteiro no runner (LocalStack + Terraform + central com
# Fleet + uma loja via instalador) e roda o teste de ponta a ponta.
name: e2e

on:
  pull_request:
    paths:
      - .github/workflows/e2e.yml
      - .github/actions/**
      - Makefile
      - apps/**
      - platform/**
      - smoke/**
      - installer/**
      - lab/**
      - src/**
      - terraform/**
      - central/**
  workflow_dispatch:

# Um push novo no PR cancela a execucao anterior (o lab leva de 10 a 25 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# shell: bash liga o pipefail; o padrao do runner (bash -e) deixa um
# `script | tee` passar mesmo com o script falhando.
defaults:
  run:
    shell: bash

jobs:
  loja:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # Um job por perfil: o completo (recibo, busca) e o enxuto (so pagamento).
      matrix:
        include:
          - { loja: loja-001, perfil: completo }
          - { loja: loja-002, perfil: enxuto }
    name: loja (${{ matrix.perfil }})
    env:
      LOJA: ${{ matrix.loja }}
    steps:
      # O pull do Playwright (~2 GB) junto com as imagens da loja levava o no a
      # DiskPressure: o kubelet despejava o pdv-web e o print pegava 503.
      # Roda em segundo plano enquanto o resto prepara; o lab espera terminar.
      - name: liberar disco do runner
        run: |
          nohup sudo sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost; docker image prune -af; touch /tmp/disco-livre' \
            >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/ferramentas-lab
      # O Fleet do lab le a branch local pelo servidor git do laboratorio.
      - run: git switch -c e2e
      - name: esperar a limpeza de disco
        run: |
          timeout 600 bash -c 'until [[ -f /tmp/disco-livre ]]; do sleep 5; done'
          df -h /
      - run: lab/nuvem.sh up
      - run: lab/central.sh up fleet
      - run: lab/loja.sh up "${LOJA}" 8080
      - name: esperar a loja ficar pronta
        run: |
          export KUBECONFIG="lab/.cache/${LOJA}.kubeconfig"
          for _ in $(seq 1 90); do
            kubectl -n loja get deploy eventos-consumidor >/dev/null 2>&1 && break
            sleep 10
          done
          kubectl -n loja wait --for=condition=Available deploy --all --timeout=15m
          kubectl -n loja rollout status statefulset --timeout=10m
      - run: lab/testes/e2e.sh "${LOJA}" 8080
      - name: rotacao da chave do webhook
        run: lab/testes/rotacao.sh "${LOJA}" 8080
      - name: atualizacao pelo GitOps (commit novo chega na loja)
        if: matrix.perfil == 'completo'
        run: lab/testes/atualizacao.sh "${LOJA}"
      - name: instalador de novo na mesma loja (idempotencia)
        if: matrix.perfil == 'completo'
        run: |
          lab/loja.sh up "${LOJA}" 8080
          lab/semente.sh "${LOJA}"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://pdv.localhost:8080/api/rpc/entrar \
            -H 'Content-Type: application/json' -d '{"login":"caixa1","pin":"1234"}')"
          echo "login depois de reinstalar: HTTP ${code}"
          [[ "${code}" == 200 ]]
      # Print e documentacao, nao teste: so sob demanda (poupa ~2 GB por PR).
      - name: prints do caixa para o README
        if: github.event_name == 'workflow_dispatch' && matrix.perfil == 'completo'
        continue-on-error: true
        run: |
          mkdir -p prints
          docker run --rm --network host --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/lab/testes/captura.py:/captura.py:ro" -v "$PWD/prints:/saida" \
            mcr.microsoft.com/playwright/python:v1.65.0-noble \
            sh -c "pip install -q --user playwright==1.65.0 && python /captura.py http://pdv.localhost:8080 /saida" || {
            # Falha intermitente: "no available server" no Traefik. Registra o estado do pdv-web.
            export KUBECONFIG="lab/.cache/${LOJA}.kubeconfig"
            kubectl -n loja get pods,endpointslices -l app.kubernetes.io/name=pdv-web -o wide
            kubectl -n loja describe pods -l app.kubernetes.io/name=pdv-web | tail -30
            kubectl -n loja logs deploy/pdv-web --tail=30 --all-containers
            kubectl -n loja get events --sort-by=.lastTimestamp | grep -i pdv | tail -15
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event_name == 'workflow_dispatch' && matrix.perfil == 'completo'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: prints-do-caixa
          path: prints/*.png
      - name: diagnostico em caso de falha
        if: failure()
        run: |
          export KUBECONFIG=lab/.cache/central.kubeconfig
          kubectl -n fleet-default get bundles -o wide || true
          export KUBECONFIG="lab/.cache/${LOJA}.kubeconfig"
          kubectl get pods -A || true
          kubectl -n loja get events --sort-by=.lastTimestamp | tail -40 || true
          for d in eventos-consumidor eventos-relay webhook-gateway gotenberg api; do
            echo "== $d"; kubectl -n loja logs deploy/$d --tail=40 || true
          done
