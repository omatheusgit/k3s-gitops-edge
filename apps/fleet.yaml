defaultNamespace: loja
keepResources: true
labels:
  app.kubernetes.io/component: apps
kustomize:
  dir: perfis/completo
dependsOn:
  - selector:
      matchLabels:
        app.kubernetes.io/component: loja
  - selector:
      matchLabels:
        app.kubernetes.io/component: ingress
# O Fleet usa a primeira que casar: as de laboratorio vem antes.
targetCustomizations:
  - name: lab-enxuto
    clusterSelector:
      matchLabels:
        perfil: enxuto
        ambiente: lab
    kustomize:
      dir: perfis/lab-enxuto
  - name: lab-completo
    clusterSelector:
      matchLabels:
        ambiente: lab
    kustomize:
      dir: perfis/lab-completo
  - name: enxuto
    clusterSelector:
      matchLabels:
        perfil: enxuto
    kustomize:
      dir: perfis/enxuto
