# Cache de idempotencia dos eventos. Nao precisa persistir: a garantia
# final esta no banco (pagamento_ref unico e confirmacao idempotente).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          args: ["--requirepass", "$(REDIS_SENHA)", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
          env:
            - name: REDIS_SENHA
              valueFrom: { secretKeyRef: { name: loja-segredos, key: redis_senha } }
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - { name: dados, mountPath: /data }
      volumes:
        - { name: dados, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
