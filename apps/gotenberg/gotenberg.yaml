# Gera o PDF do recibo a partir de HTML (Chromium headless).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotenberg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:9.4.0-chromium
          args:
            - gotenberg
            - --api-timeout=30s
            - --chromium-auto-start=false
            - --chromium-max-queue-size=4
            - --log-std-format=json
          ports:
            - { name: http, containerPort: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 448Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/gotenberg }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 64Mi } }
        - { name: home, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
spec:
  selector:
    app.kubernetes.io/name: gotenberg
  ports:
    - name: http
      port: 3000
