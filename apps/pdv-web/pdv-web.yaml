apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdv-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdv-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdv-web
        exposto: "sim"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.3-alpine@sha256:b3f2436575bd5be7386518084d842dac414ab4962712afa31e99e0942a56e3b2
          env:
            # O entrypoint poe o IP do DNS do pod em NGINX_LOCAL_RESOLVERS.
            - { name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS, value: "1" }
            - name: MEILI_CHAVE
              valueFrom: { secretKeyRef: { name: loja-segredos, key: meili_chave } }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /saude, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: modelo, mountPath: /etc/nginx/templates, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: site
          configMap: { name: pdv-web-site }
        - name: modelo
          configMap: { name: pdv-web-nginx }
        - { name: conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: pdv-web
spec:
  selector:
    app.kubernetes.io/name: pdv-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pdv
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`^pdv\..+`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: limite
        - name: remove-api
      services:
        - name: api
          port: 80
    - match: HostRegexp(`^pdv\..+`) && PathPrefix(`/busca`)
      kind: Rule
      middlewares:
        - name: limite
        - name: exige-jwt
      services:
        - name: pdv-web
          port: 80
    - match: HostRegexp(`^pdv\..+`)
      kind: Rule
      middlewares:
        - name: cabecalhos
      services:
        - name: pdv-web
          port: 80
