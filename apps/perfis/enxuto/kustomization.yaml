# Loja com servidor pequeno: so o essencial para vender e receber pagamento.
# Sem busca e sem PDF; o consumidor de eventos desliga essas etapas.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loja
labels:
  - pairs:
      app.kubernetes.io/part-of: k3s-gitops-edge
resources:
  - ../../postgres
  - ../../api
  - ../../pdv-web
  - ../../redis
  - ../../rabbitmq
  - ../../eventos
patches:
  # Os tres processos precisam saber as etapas: o relay nao publica evento que
  # ninguem consome e ninguem declara fila sem consumidor.
  - target:
      kind: Deployment
      name: ^(eventos-relay|eventos-consumidor|webhook-gateway)$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ETAPAS, value: pagamentos }
