# Loja com servidor folgado: caixa, busca e recibo em PDF locais.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loja
labels:
  - pairs:
      app.kubernetes.io/part-of: k3s-gitops-edge
resources:
  - ../../postgres
  - ../../api
  - ../../pdv-web
  - ../../redis
  - ../../rabbitmq
  - ../../busca
  - ../../gotenberg
  - ../../eventos
