apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api.yaml
# Migracao nova = arquivo novo aqui. O hash do ConfigMap muda, o Deployment
# da API e recriado e o dbmate aplica o que falta antes do PostgREST subir.
configMapGenerator:
  - name: api-migracoes
    files:
      - migracoes/20261111000001_esquema.sql
      - migracoes/20261111000002_jwt.sql
      - migracoes/20261111000003_api.sql
      - migracoes/20261111000004_permissoes.sql
      - migracoes/20261111000005_dados.sql
      - migracoes/20261112000006_semente_fora.sql
      - migracoes/20261112000007_login_e_search_path.sql
      - migracoes/20261112000008_pagamento_confere_valor.sql
