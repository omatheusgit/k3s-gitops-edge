# PostgREST: a API do caixa e o proprio esquema "api" do banco.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        exposto: "sim"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migracoes antes da API: o PostgREST so sobe com o esquema na versao
        # certa. O lock permite varias replicas subindo ao mesmo tempo.
        - name: migracoes
          image: ghcr.io/amacneil/dbmate:2.38.1@sha256:b0c8a87bfef4f2819fdb0a68ca357a44d12fb90d23eca695fcfc3b7e159cb1c5
          args: ["--wait", "--wait-timeout", "5m", "--migration-lock", "--no-dump-schema", "up"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: loja-segredos, key: MIGRACAO_URL } }
            - { name: DBMATE_MIGRATIONS_DIR, value: /migracoes }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: migracoes, mountPath: /migracoes, readOnly: true }
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
          env:
            - name: PGRST_DB_URI
              valueFrom: { secretKeyRef: { name: loja-segredos, key: PGRST_DB_URI } }
            - name: PGRST_JWT_SECRET
              valueFrom: { secretKeyRef: { name: loja-segredos, key: jwt_secret } }
            - name: PGRST_DB_SCHEMAS
              value: api
            - name: PGRST_DB_ANON_ROLE
              value: anonimo
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
            - name: PGRST_DB_POOL
              value: "5"
          ports:
            - { name: http, containerPort: 3000 }
            - { name: admin, containerPort: 3001 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { memory: 96Mi }
          # /ready consulta o banco; fica so na readiness. A liveness nao
          # depende do banco para nao reiniciar a API quando o banco oscila.
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: migracoes
          configMap: { name: api-migracoes }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
