# PostgREST: a API do caixa e o proprio esquema "api" do banco.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        exposto: "sim"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.5
          env:
            - name: PGRST_DB_URI
              valueFrom: { secretKeyRef: { name: loja-segredos, key: PGRST_DB_URI } }
            - name: PGRST_JWT_SECRET
              valueFrom: { secretKeyRef: { name: loja-segredos, key: jwt_secret } }
            - name: PGRST_DB_SCHEMAS
              value: api
            - name: PGRST_DB_ANON_ROLE
              value: anonimo
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
            - name: PGRST_DB_POOL
              value: "5"
          ports:
            - { name: http, containerPort: 3000 }
            - { name: admin, containerPort: 3001 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { memory: 96Mi }
          # /ready consulta o banco; fica so na readiness. A liveness nao
          # depende do banco para nao reiniciar a API quando o banco oscila.
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
