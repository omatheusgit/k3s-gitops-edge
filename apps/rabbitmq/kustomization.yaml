apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rabbitmq.yaml
# Usuarios, permissoes e policies sao carregados no boot (load_definitions).
# As senhas entram no initContainer, que troca os __HASH_*__ do modelo.
configMapGenerator:
  - name: rabbitmq-definicoes
    files:
      - definicoes.json.modelo
  - name: rabbitmq-conf
    files:
      - 20-definicoes.conf
