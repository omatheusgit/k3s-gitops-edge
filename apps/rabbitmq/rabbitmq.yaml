apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        # Sem isto o kubelet reaplica g+rw no volume a cada montagem, e o
        # Postgres (PGDATA) e o Erlang (.erlang.cookie) se recusam a subir.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.7-management-alpine@sha256:eb338b3fc8f5c251028c0022ac0de3fe1db2d599d1c6a08b45898f756f248881
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: loja
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: loja-segredos, key: rabbitmq_senha } }
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 1:1 +A 4"
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: painel, containerPort: 15672 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
          # Boot do RabbitMQ pode passar de 1 min num servidor pequeno; ate a
          # porta abrir, a liveness nao conta.
          startupProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 30
          volumeMounts:
            - { name: dados, mountPath: /var/lib/rabbitmq }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672 }
    - { name: painel, port: 15672 }
