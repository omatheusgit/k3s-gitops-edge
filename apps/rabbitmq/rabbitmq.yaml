apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        exposto: "sim"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.7-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: loja
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: loja-segredos, key: rabbitmq_senha } }
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 1:1 +A 4"
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: painel, containerPort: 15672 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket: { port: amqp }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: dados, mountPath: /var/lib/rabbitmq }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672 }
    - { name: painel, port: 15672 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`^rabbit\..+`)
      kind: Rule
      middlewares:
        - name: cabecalhos
      services:
        - name: rabbitmq
          port: 15672
