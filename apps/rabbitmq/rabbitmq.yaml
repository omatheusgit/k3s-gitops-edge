apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        # Sem isto o kubelet reaplica g+rw no volume a cada montagem, e o
        # Postgres (PGDATA) e o Erlang (.erlang.cookie) se recusam a subir.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Um usuario por processo, nenhum administrador: o relay so publica
      # venda.* e produto.*, o gateway so pagamento.confirmado. Antes os tres
      # usavam o administrador "loja", e qualquer um deles quitava venda
      # publicando pagamento.confirmado direto no exchange (#28).
      initContainers:
        - name: definicoes
          image: rabbitmq:4.3.7-management-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              h() { rabbitmqctl -q hash_password "$1" | tail -1; }
              sed -e "s#__HASH_ADMIN__#$(h "$SENHA_ADMIN")#" \
                  -e "s#__HASH_RELAY__#$(h "$SENHA_RELAY")#" \
                  -e "s#__HASH_CONSUMIDOR__#$(h "$SENHA_CONSUMIDOR")#" \
                  -e "s#__HASH_GATEWAY__#$(h "$SENHA_GATEWAY")#" \
                  /modelo/definicoes.json.modelo >/definicoes/definicoes.json
          env:
            - name: SENHA_ADMIN
              valueFrom: { secretKeyRef: { name: loja-segredos, key: rabbitmq_senha } }
            - name: SENHA_RELAY
              valueFrom: { secretKeyRef: { name: loja-segredos, key: amqp_relay_senha } }
            - name: SENHA_CONSUMIDOR
              valueFrom: { secretKeyRef: { name: loja-segredos, key: amqp_consumidor_senha } }
            - name: SENHA_GATEWAY
              valueFrom: { secretKeyRef: { name: loja-segredos, key: amqp_gateway_senha } }
            # O rabbitmqctl grava o cookie do Erlang em HOME, mesmo so para o hash.
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: modelo, mountPath: /modelo, readOnly: true }
            - { name: definicoes, mountPath: /definicoes }
            - { name: tmp-init, mountPath: /tmp }
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.7-management-alpine
          env:
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 1:1 +A 4"
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: painel, containerPort: 15672 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
          # Boot do RabbitMQ pode passar de 1 min num servidor pequeno; ate a
          # porta abrir, a liveness nao conta.
          startupProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 30
          volumeMounts:
            - { name: dados, mountPath: /var/lib/rabbitmq }
            - { name: tmp, mountPath: /tmp }
            - { name: definicoes, mountPath: /etc/rabbitmq/definicoes, readOnly: true }
            - { name: conf, mountPath: /etc/rabbitmq/conf.d/20-definicoes.conf, subPath: 20-definicoes.conf, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: tmp-init, emptyDir: {} }
        - { name: definicoes, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - name: modelo
          configMap: { name: rabbitmq-definicoes }
        - name: conf
          configMap: { name: rabbitmq-conf }
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672 }
    - { name: painel, port: 15672 }
